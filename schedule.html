<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script>localStorage.setItem("team_money_config", JSON.stringify({url:"https://aphbgeracanffmnknwae.supabase.co",key:"sb_publishable_7ZYIZAfZBWelVv48D1YEsA_LpzPmqGv"}));</script>
<title>ET Works | ตารางงาน</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
header{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}header .row{align-items:center}header button{white-space:nowrap}

.ui-icon{width:20px;height:20px;display:inline-block;vertical-align:-4px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;margin-right:8px}

*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f5f7fb;color:#172033}
header{background:#111827;color:#fff;padding:16px 22px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-size:21px;margin:0}.wrap{max-width:1180px;margin:22px auto;padding:0 16px}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 3px 14px #00000008}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
input,select,textarea,button{font:inherit;padding:10px 12px;border-radius:9px;border:1px solid #d1d5db}
input,select,textarea{background:#fff;color:#172033}button{cursor:pointer;background:#111827;color:#fff;border:0}
button.secondary{background:#e5e7eb;color:#111827}button.danger{background:#b91c1c}
button:disabled{opacity:.45;cursor:not-allowed}.muted{color:#6b7280;font-size:13px}.error{color:#b91c1c;margin-top:8px}
.topline{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.month-title{font-size:20px;font-weight:750}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px;margin-top:16px}
.weekday{text-align:center;color:#6b7280;font-size:13px;font-weight:700;padding:6px 0}
.day{min-height:104px;border:1px solid #e5e7eb;background:#fff;color:#172033;text-align:left;padding:8px;border-radius:10px;display:flex;flex-direction:column;gap:5px}
.day:hover{border-color:#64748b}.day.other{opacity:.35}.day.today{border:2px solid #2563eb}.day.selected{background:#eff6ff;border:2px solid #2563eb}
.day-num{font-weight:750}.day-events{font-size:11px;line-height:1.35;background:#eef2ff;color:#3730a3;border-radius:5px;padding:3px 5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.day-members{display:flex;flex-wrap:wrap;gap:2px;max-height:34px;overflow:hidden}.day-member{font-size:9px;line-height:1.2;border-radius:4px;padding:2px 3px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.day-more{font-size:11px;color:#6b7280}.content-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(300px,.85fr);gap:16px;align-items:start}
.field{display:flex;flex-direction:column;gap:5px;min-width:0;flex:1}.field label{font-size:13px;color:#4b5563;font-weight:650}
.field input,.field textarea{width:100%}.field textarea{min-height:74px;resize:vertical}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.attendee-choices{display:flex;flex-wrap:wrap;gap:8px}.attendee-choice{background:var(--member-bg);color:var(--member-fg);border:1px solid var(--member-border);border-radius:999px;padding:8px 13px;opacity:.72;transition:opacity .15s,transform .15s}.attendee-choice.selected{opacity:1;box-shadow:0 0 0 2px var(--member-border);font-weight:750;transform:translateY(-1px)}.member-badges{display:inline-flex;flex-wrap:wrap;gap:5px;vertical-align:middle}.member-badge{display:inline-block;padding:3px 8px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}.attendee-empty{color:#9ca3af;font-size:13px;padding:8px 0}.full{grid-column:1/-1}
.job{border:1px solid #e5e7eb;border-radius:11px;padding:13px;margin-top:10px}.job-head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;flex-wrap:wrap}
.job-title{font-weight:750}.job-meta{font-size:13px;color:#6b7280;margin-top:5px;line-height:1.6}.job-actions{display:flex;gap:6px}.job-actions button{font-size:12px;padding:7px 9px}
.empty{padding:22px;text-align:center;color:#9ca3af;background:#f8fafc;border-radius:10px;margin-top:10px}
#app{display:block}#login{max-width:430px;margin:70px auto}
@media(max-width:760px){.content-grid{grid-template-columns:1fr}.day{min-height:78px;padding:5px;gap:3px}.day-events{font-size:10px;padding:2px 3px}.calendar{gap:4px}.weekday{font-size:11px}.day-more{font-size:10px}}
@media(max-width:430px){.day{min-height:62px}.day-events{max-width:100%}.calendar{gap:3px}.card{padding:13px}.form-grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style>
</head>
<body>
<header><h1><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18"/></svg> ET Works · ตารางงาน</h1><div class="row"><span id="userEmail" class="muted" style="color:#d1d5db"></span><button class="secondary" onclick="goHome()">⌂ หน้าหลัก</button></div></header>
<div id="login" class="card" style="display:none"><h2>กรุณาเข้าสู่ระบบ</h2><p class="muted">เข้าสู่ระบบผ่าน ET Works ก่อน แล้วกลับมาหน้าตารางงานอีกครั้ง</p><button onclick="location.href='index.html'">ไปหน้าเข้าสู่ระบบ</button></div>
<main id="app" class="wrap">
 <div class="content-grid">
  <section class="card">
   <div class="topline">
    <div class="row"><button id="prevMonth" class="secondary">‹</button><div id="monthTitle" class="month-title"></div><button id="nextMonth" class="secondary">›</button></div>
    <button id="todayBtn" class="secondary">วันนี้</button>
   </div>
   <div class="calendar" id="calendar"></div>
   <div class="muted" style="margin-top:12px">กดวันที่ต้องการเพื่อดูงาน หรือเลือกวันว่างเพื่อจองงานใหม่</div>
  </section>
  <section class="card">
   <div class="topline"><h2 id="selectedTitle" style="font-size:18px;margin:0">รายการงาน</h2><span id="dayCount" class="muted"></span></div>
   <div id="dayJobs"></div>
   <div class="row" style="justify-content:space-between;margin-top:18px"><h3 id="formTitle" style="font-size:16px;margin:0">＋ จองวัน / เพิ่มงาน</h3><button id="cancelEdit" class="secondary" style="display:none">ยกเลิกแก้ไข</button></div>
   <form id="jobForm" style="margin-top:12px">
    <div class="form-grid">
     <div class="field"><label for="workType">ประเภทงาน</label><select id="workType"><option>ประชุม (Meeting)</option><option>งานก่อสร้าง</option><option>นัดคุยกับลูกค้า</option><option>สำรวจหน้างาน</option><option>ติดตั้งระบบ</option><option>PM / ซ่อมบำรุง</option><option>ส่งมอบงาน</option><option>งานเอกสาร</option><option>งานทั่วไป</option><option>อื่น ๆ</option></select></div>
     <div class="field"><label for="jobTitle">ชื่องาน *</label><input id="jobTitle" required maxlength="160" placeholder="เช่น ติดตั้ง Solar / PM Compressor"></div>
     <div class="field full"><label for="workSite">สถานที่เข้าหน้างาน</label><input id="workSite" maxlength="200" placeholder="ชื่อลูกค้า / โรงงาน / พื้นที่"></div>
     <div class="field"><label for="workDate">วันที่ *</label><input id="workDate" type="date" required></div>
     <div class="field full"><label>สมาชิกที่ไปหน้างาน</label><div id="attendeeChoices" class="attendee-choices"></div></div>
     <div class="field"><label for="startTime">เวลาเริ่ม</label><input id="startTime" type="time"></div>
     <div class="field"><label for="endTime">เวลาสิ้นสุด</label><input id="endTime" type="time"></div>
     <div class="field full"><label for="jobNote">รายละเอียด / หมายเหตุ</label><textarea id="jobNote" maxlength="1000" placeholder="รายละเอียดงาน อุปกรณ์ที่ต้องเตรียม หรือหมายเหตุ"></textarea></div>
    </div>
    <div class="row" style="margin-top:12px"><button id="saveJob" type="submit">บันทึกงาน</button><span id="formMsg" class="error"></span></div>
   </form>
  </section>
 </div>
</main>
<script>
let sb,user,projects=[],teamMembers=[],currentProject=null,monthCursor=new Date(new Date().getFullYear(),new Date().getMonth(),1),selectedDate=toISODate(new Date()),jobs=[],editingId=null;
const $=id=>document.getElementById(id);
function goHome(){window.location.assign(new URL("./",window.location.href).href)}
function toISODate(d){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function parseDate(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function thaiDate(s){return parseDate(s).toLocaleDateString('th-TH',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}
function timeRange(j){return [j.start_time?j.start_time.slice(0,5):'',j.end_time?j.end_time.slice(0,5):''].filter(Boolean).join(' – ')||'ไม่ระบุเวลา'}
async function init(){
 const cfg=JSON.parse(localStorage.getItem('team_money_config')||'null');
 if(!cfg?.url||!cfg?.key){$('app').style.display='none';$('login').style.display='block';return}
 sb=supabase.createClient(cfg.url,cfg.key);
 const {data:{session}}=await sb.auth.getSession();user=session?.user;
 if(!user){$('app').style.display='none';$('login').style.display='block';return}
 $('app').style.display='block';
 $('userEmail').textContent=user.email||'';
 $('prevMonth').onclick=()=>changeMonth(-1);$('nextMonth').onclick=()=>changeMonth(1);
 $('todayBtn').onclick=()=>{const d=new Date();monthCursor=new Date(d.getFullYear(),d.getMonth(),1);selectDate(toISODate(d))};
 
 $('jobForm').onsubmit=saveJob;$('cancelEdit').onclick=resetForm;
 const {data,error}=await sb.from('projects').select('id,name,created_by').order('created_at',{ascending:true});
 if(error){$('calendar').innerHTML='<div class="empty">โหลดข้อมูลโครงการไม่สำเร็จ: '+esc(error.message)+'</div>';return}
 projects=data||[];
 if(!projects.length){$('calendar').innerHTML='<div class="empty">ยังไม่มี Project กรุณาสร้าง Project ที่หน้าหลักก่อน</div>';return}
 currentProject=projects[0];
 await loadTeamMembers();await loadJobs();
}
function changeMonth(n){monthCursor=new Date(monthCursor.getFullYear(),monthCursor.getMonth()+n,1);renderCalendar()}
async function selectDate(date){selectedDate=date;$('workDate').value=date;resetForm(false);await loadJobs()}
async function loadTeamMembers(){
 if(!currentProject)return;
 const {data,error}=await sb.rpc('get_project_members',{p_project_id:currentProject.id});
 if(error){teamMembers=[];$('attendeeChoices').innerHTML='<div class="attendee-empty">โหลดรายชื่อสมาชิกไม่สำเร็จ: '+esc(error.message)+'</div>';return}
 teamMembers=data||[];
 renderAttendeeChoices([]);
}
const memberPalette=[['#dbeafe','#1e40af','#60a5fa'],['#dcfce7','#166534','#4ade80'],['#fce7f3','#9d174d','#f472b6'],['#fef3c7','#92400e','#fbbf24'],['#ede9fe','#5b21b6','#a78bfa'],['#cffafe','#155e75','#22d3ee'],['#ffedd5','#9a3412','#fb923c'],['#f3e8ff','#6b21a8','#c084fc']];
function memberColor(id){const ordered=[...teamMembers].sort((a,b)=>String(a.email||'').localeCompare(String(b.email||'')));const index=ordered.findIndex(m=>m.user_id===id);return memberPalette[(index<0?0:index)%memberPalette.length]}
function memberBadges(ids){
 const members=(ids||[]).map(id=>teamMembers.find(m=>m.user_id===id)).filter(Boolean);
 if(!members.length)return '';
 return '<span class="member-badges">'+members.map(m=>{const p=memberColor(m.user_id);return '<span class="member-badge" style="background:'+p[0]+';color:'+p[1]+';border:1px solid '+p[2]+'">'+esc(m.email)+'</span>'}).join('')+'</span>';
}
function renderAttendeeChoices(selectedIds=[]){
 const selected=new Set(selectedIds);
 if(!teamMembers.length){$('attendeeChoices').innerHTML='<div class="attendee-empty">ไม่พบสมาชิกใน Project นี้</div>';return}
 $('attendeeChoices').innerHTML=teamMembers.map(m=>{const p=memberColor(m.user_id);return '<button type="button" class="attendee-choice '+(selected.has(m.user_id)?'selected':'')+'" style="--member-bg:'+p[0]+';--member-fg:'+p[1]+';--member-border:'+p[2]+'" data-member="'+esc(m.user_id)+'" aria-pressed="'+selected.has(m.user_id)+'">'+(selected.has(m.user_id)?'✓ ':'')+esc(m.email)+'</button>'}).join('');
 $('attendeeChoices').querySelectorAll('[data-member]').forEach(b=>b.onclick=()=>{
  const id=b.dataset.member;
  const ids=Array.from($('attendeeChoices').querySelectorAll('[data-member].selected')).map(x=>x.dataset.member);
  const next=ids.includes(id)?ids.filter(x=>x!==id):[...ids,id];
  renderAttendeeChoices(next);
 });
}
function selectedAttendeeIds(){
 return Array.from($('attendeeChoices').querySelectorAll('[data-member].selected')).map(b=>b.dataset.member);
}
function attendeeLabel(j){
 const ids=j.attendee_ids||[];
 if(ids.length)return ids.map(id=>teamMembers.find(m=>m.user_id===id)?.email||'สมาชิกทีม').join(', ');
 return j.attendees||'ยังไม่ระบุผู้เข้าหน้างาน';
}
async function loadJobs(){
 if(!currentProject)return;
 const start=toISODate(monthCursor),end=toISODate(new Date(monthCursor.getFullYear(),monthCursor.getMonth()+1,0));
 const {data,error}=await sb.from('work_schedules').select('*').eq('project_id',currentProject.id).gte('work_date',start).lte('work_date',end).order('start_time',{ascending:true});
 if(error){$('dayJobs').innerHTML='<div class="empty">โหลดตารางงานไม่สำเร็จ: '+esc(error.message)+'</div>';return}
 jobs=data||[];
 renderCalendar();renderDayJobs();
}
function renderCalendar(){
 $('monthTitle').textContent=monthCursor.toLocaleDateString('th-TH',{month:'long',year:'numeric'});
 const first=new Date(monthCursor.getFullYear(),monthCursor.getMonth(),1),offset=first.getDay(),days=new Date(monthCursor.getFullYear(),monthCursor.getMonth()+1,0).getDate();
 const prevDays=new Date(monthCursor.getFullYear(),monthCursor.getMonth(),0).getDate();
 const today=toISODate(new Date());let out=['อา.','จ.','อ.','พ.','พฤ.','ศ.','ส.'].map(x=>'<div class="weekday">'+x+'</div>').join('');
 for(let i=0;i<42;i++){
  let dateObj,other=false;
  if(i<offset){dateObj=new Date(monthCursor.getFullYear(),monthCursor.getMonth()-1,prevDays-offset+i+1);other=true}
  else if(i>=offset+days){dateObj=new Date(monthCursor.getFullYear(),monthCursor.getMonth()+1,i-offset-days+1);other=true}
  else dateObj=new Date(monthCursor.getFullYear(),monthCursor.getMonth(),i-offset+1);
  const iso=toISODate(dateObj),items=jobs.filter(j=>j.work_date===iso);
  const cls=['day',other?'other':'',iso===today?'today':'',iso===selectedDate?'selected':''].filter(Boolean).join(' ');
  out+='<button type="button" class="'+cls+'" data-date="'+iso+'"><span class="day-num">'+dateObj.getDate()+'</span>'+items.slice(0,2).map(j=>{const people=(j.attendee_ids||[]).map(id=>teamMembers.find(m=>m.user_id===id)).filter(Boolean);const badges=people.length?'<span class="day-members">'+people.map(m=>{const p=memberColor(m.user_id);const label=(m.email||'สมาชิก').split('@')[0];return '<span class="day-member" title="'+esc(m.email)+'" style="background:'+p[0]+';color:'+p[1]+'">'+esc(label)+'</span>'}).join('')+'</span>':'';return '<span class="day-events" title="'+esc((j.work_type||'งานทั่วไป')+' · '+j.job_title)+'">'+esc(j.work_type||'งานทั่วไป')+' · '+esc(j.job_title)+'</span>'+badges}).join('')+(items.length>2?'<span class="day-more">+'+(items.length-2)+' งาน</span>':'')+'</button>';
 }
 $('calendar').innerHTML=out;
 $('calendar').querySelectorAll('[data-date]').forEach(b=>b.onclick=()=>{const d=b.dataset.date;if(parseDate(d).getMonth()!==monthCursor.getMonth()){monthCursor=new Date(parseDate(d).getFullYear(),parseDate(d).getMonth(),1)}selectDate(d)});
}
function renderDayJobs(){
 const list=jobs.filter(j=>j.work_date===selectedDate);
 $('selectedTitle').textContent=thaiDate(selectedDate);$('dayCount').textContent=list.length+' งาน';
 if(!list.length){$('dayJobs').innerHTML='<div class="empty">วันนี้ยังไม่มีงาน<br><span class="muted">เพิ่มงานได้จากแบบฟอร์มด้านล่าง</span></div>';return}
 $('dayJobs').innerHTML=list.map(j=>'<article class="job"><div class="job-head"><div><div class="job-title">'+esc(j.job_title)+'</div><div class="job-meta">'+(j.work_site?'📍 '+esc(j.work_site)+'<br>':'')+'🕒 '+esc(timeRange(j))+'<br>👷 '+(j.attendee_ids?.length?memberBadges(j.attendee_ids):esc(attendeeLabel(j)))+(j.note?'<br>📝 '+esc(j.note):'')+'</div></div><div class="job-actions"><button type="button" class="secondary" data-edit="'+j.id+'">แก้ไข</button><button type="button" class="danger" data-delete="'+j.id+'">ลบ</button></div></div></article>').join('');
 $('dayJobs').querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editJob(b.dataset.edit));
 $('dayJobs').querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>deleteJob(b.dataset.delete));
}
function resetForm(clearMessage=true){
 editingId=null;$('jobForm').reset();renderAttendeeChoices([]);$('workDate').value=selectedDate;$('formTitle').textContent='＋ จองวัน / เพิ่มงาน';$('saveJob').textContent='บันทึกงาน';$('cancelEdit').style.display='none';if(clearMessage)$('formMsg').textContent='';
}
function editJob(id){
 const j=jobs.find(x=>x.id===id);if(!j)return;
 editingId=id;selectedDate=j.work_date;$('workDate').value=j.work_date;$('workType').value=j.work_type||'งานทั่วไป';$('jobTitle').value=j.job_title||'';$('workSite').value=j.work_site||'';renderAttendeeChoices(j.attendee_ids||[]);$('startTime').value=j.start_time||'';$('endTime').value=j.end_time||'';$('jobNote').value=j.note||'';
 $('formTitle').textContent='✏️ แก้ไขงาน';$('saveJob').textContent='บันทึกการแก้ไข';$('cancelEdit').style.display='inline-block';renderCalendar();renderDayJobs();
}
async function saveJob(e){
 e.preventDefault();$('formMsg').textContent='';
 if(!currentProject)return;
 const work_date=$('workDate').value,job_title=$('jobTitle').value.trim(),start_time=$('startTime').value||null,end_time=$('endTime').value||null;
 if(!work_date||!job_title){$('formMsg').textContent='กรุณากรอกวันที่และชื่องาน';return}
 if(start_time&&end_time&&end_time<start_time){$('formMsg').textContent='เวลาสิ้นสุดต้องไม่น้อยกว่าเวลาเริ่ม';return}
 const payload={project_id:currentProject.id,work_date,job_title,work_type:$('workType').value,work_site:$('workSite').value.trim()||null,start_time,end_time,attendee_ids:selectedAttendeeIds(),attendees:null,note:$('jobNote').value.trim()||null};
 $('saveJob').disabled=true;
 let result;
 if(editingId)result=await sb.from('work_schedules').update(payload).eq('id',editingId).select().single();
 else result=await sb.from('work_schedules').insert({...payload,created_by:user.id}).select().single();
 $('saveJob').disabled=false;
 if(result.error){$('formMsg').textContent='บันทึกไม่สำเร็จ: '+result.error.message;return}
 selectedDate=work_date;monthCursor=new Date(parseDate(work_date).getFullYear(),parseDate(work_date).getMonth(),1);resetForm();await loadJobs();
}
async function deleteJob(id){
 const j=jobs.find(x=>x.id===id);if(!j||!confirm('ยืนยันลบงาน "'+j.job_title+'" ใช่หรือไม่?'))return;
 const {error}=await sb.from('work_schedules').delete().eq('id',id);
 if(error){alert('ลบไม่สำเร็จ: '+error.message);return}
 await loadJobs();
}
init().catch(err=>{ $('login').style.display='block'; $('login').innerHTML='<h2>โหลดตารางงานไม่สำเร็จ</h2><p class="muted">'+esc(err?.message||'เกิดข้อผิดพลาด')+'</p><button onclick="location.href=\'index.html\'">กลับหน้าหลัก</button>'; });
</script>
</body>
</html>
